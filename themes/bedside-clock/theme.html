<!DOCTYPE html>
<html data-kp-orientation="portrait" data-kp-dither="threshold">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(Inter-Regular.ttf); }
  @font-face { font-family: Inter; font-weight: 700; src: url(Inter-Bold.ttf); }
  html, body { margin: 0; height: 100%; }
  body { background: #000; color: #fff; font-family: Inter, sans-serif; }
  .page { box-sizing: border-box; height: 100%; padding: 50px 30px 40px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 20px; }
  .put { margin-top: 56px; text-align: center; font-size: 20px; font-weight: 700; letter-spacing: 6px; padding-left: 6px; }
  .clock { margin-top: 6px; font-size: 140px; font-weight: 700; line-height: 1; letter-spacing: -6px; text-align: center; }
  .date { margin-top: 18px; text-align: center; font-size: 30px; letter-spacing: 4px; }
  .moon { margin: 34px auto 0; }
  .book { margin-top: auto; }
  .kicker { font-size: 20px; font-weight: 700; letter-spacing: 6px; }
  .chapter { margin-top: 8px; font-size: 30px; font-weight: 700; line-height: 36px; }
  .track { margin-top: 16px; height: 12px; border: 3px solid #fff; border-radius: 10px; padding: 2px; }
  .bar { height: 100%; }
  .where { margin-top: 10px; font-size: 20px; line-height: 26px; }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <span>SLEEPING</span>
    <span style="width: 120px; text-align: right;" data-template='{{device.charging ? icon("battery-charging") : icon("battery")}} {{device.battery}}%' data-hide-if-empty>82%</span>
  </div>
  <!-- The screen doesn't change while asleep, so the time is when the book was put down,
       not a clock. Without a set clock (no network time yet, no clock chip) it is empty and hidden. -->
  <div class="put" data-template='{{time.now ? "PUT DOWN AT" : ""}}' data-hide-if-empty>PUT DOWN AT</div>
  <div class="clock" data-glyphs="digits" data-template="{{time.now:HH:mm}}" data-hide-if-empty>22:41</div>
  <div class="date" data-template="{{time.now:dd.MM.yyyy}}" data-hide-if-empty>17.10.2026</div>
  <svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="moon"><path d="M18 5h4"/><path d="M20 3v4"/><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
  <div class="book">
    <div class="kicker">STOPPED AT</div>
    <div class="chapter" data-var="book.chapter" data-max-lines="2" data-valign="bottom" data-overflow="ellipsis" data-hide-if-empty>The Eve of the War</div>
    <div class="track"><div class="bar" data-var="book.chapter_progress" data-kind="bar"></div></div>
    <div class="where" data-template="{{book.chapter_progress}}% of the chapter, {{book.progress}}% of the book" data-hide-if-empty>40% of the chapter, 62% of the book</div>
  </div>
</div>
</body>
</html>
