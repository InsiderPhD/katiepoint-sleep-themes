<!DOCTYPE html>
<html data-kp-orientation="portrait">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(Inter-Regular.ttf); }
  @font-face { font-family: Inter; font-weight: 700; src: url(Inter-Bold.ttf); }
  html, body { margin: 0; height: 100%; }
  body { background: #fff; color: #000; font-family: Inter, sans-serif; }
  .mark { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .logo { width: 180px; height: auto; }
  .mark div { font-size: 20px; font-weight: 700; letter-spacing: 8px; padding-left: 8px; }
  .picture { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<div class="mark">
    <img class="logo" src="logo.svg" alt="KatiePoint">
    <div>SLEEPING</div>
  </div>
  <img class="picture" data-var="sleep.image" data-filter="grey" src="sample-sleep.svg" alt="">
</body>
</html>
