<!DOCTYPE html>
<html data-kp-orientation="portrait" data-kp-overlay data-kp-dither="threshold">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(Inter-Regular.ttf); }
  @font-face { font-family: Inter; font-weight: 700; src: url(Inter-Bold.ttf); }
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, sans-serif; color: #000; }
  .card {
    position: absolute; left: 22px; right: 22px; bottom: 22px; padding: 16px 20px 18px;
    background: #fff; border: 3px solid #000; border-radius: 16px;
  }
  .row { display: flex; justify-content: space-between; text-align: center; }
  .row > div { flex: 1; }
  .row > div + div { border-left: 2px solid #000; }
  .big { font-size: 30px; font-weight: 700; line-height: 36px; }
  .small { font-size: 15px; line-height: 20px; }
  .track { margin-top: 14px; height: 10px; border: 2px solid #000; border-radius: 8px; padding: 2px; }
  .bar { height: 100%; }
</style>
</head>
<body>
<div class="card">
    <div class="row">
      <div><div class="big" data-var="stats.streak">12</div><div class="small" data-template='{{plural(stats.streak, "day", "days")}} in a row'>days in a row</div></div>
      <div><div class="big" data-var="stats.today_time">34m</div><div class="small">read today</div></div>
      <div><div class="big" data-template="{{stats.goal_percent}}%">100%</div><div class="small" data-template="of {{stats.goal_minutes}} minutes">of 30 minutes</div></div>
    </div>
    <div class="track"><div class="bar" data-var="stats.goal_percent" data-kind="bar"></div></div>
  </div>
</body>
</html>
