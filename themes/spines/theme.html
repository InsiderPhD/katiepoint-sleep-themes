<!DOCTYPE html>
<html data-kp-orientation="landscape" data-kp-dither="threshold">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(Inter-Regular.ttf); }
  @font-face { font-family: Inter; font-weight: 700; src: url(Inter-Bold.ttf); }
  html, body { margin: 0; height: 100%; }
  body { background: #fff; color: #000; font-family: Inter, sans-serif; }
  .page { box-sizing: border-box; height: 100%; padding: 40px 44px 34px; display: flex; gap: 36px; }
  .left { width: 230px; display: flex; flex-direction: column; }
  .kicker { font-size: 16px; font-weight: 700; letter-spacing: 5px; }
  .now { margin-top: 12px; font-size: 30px; font-weight: 700; line-height: 36px; }
  .pct { margin-top: auto; font-size: 90px; font-weight: 700; line-height: 1; letter-spacing: -3px; }
  .read { font-size: 16px; }
  .shelf { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
  .books { display: flex; align-items: flex-end; gap: 6px; padding: 0 10px; }
  .spine { position: relative; box-sizing: border-box; border: 3px solid #000; border-radius: 3px 3px 0 0; background: #fff; }
  .spine.dark { background: #000; color: #fff; }
  .spine::before, .spine::after { content: ""; position: absolute; left: 6px; right: 6px; height: 3px; background: currentColor; }
  .spine::before { top: 14px; }
  .spine::after { bottom: 14px; }
  /* Rotated titles: the device draws live text through any 2D transform. */
  .t {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg);
    text-align: center; white-space: nowrap; font-size: 16px; font-weight: 700; line-height: 20px;
  }
  .plank { height: 14px; background: #000; border-radius: 2px; }
  .count { margin-top: 10px; text-align: right; font-size: 16px; }
</style>
</head>
<body>
<div class="page">
  <div class="left">
    <div class="kicker">ON THE SHELF</div>
    <div class="now" data-var="book.title" data-max-lines="3" data-overflow="ellipsis" data-hide-if-empty>Trollkarlens hatt</div>
    <div class="pct" data-glyphs="digits" data-template="{{book.progress}}%" data-hide-if-empty>62%</div>
    <div class="read">read so far</div>
  </div>
  <div class="shelf">
    <div class="books">
      <div class="spine dark" style="height: 300px; width: 64px;"><div class="t" style="width: 272px;" data-var="recent.2.title" data-overflow="ellipsis" data-hide-if-empty>Trollkarlens hatt</div></div>
      <div class="spine" style="height: 270px; width: 52px;"><div class="t" style="width: 242px;" data-var="recent.3.title" data-overflow="ellipsis" data-hide-if-empty>Perdido Street Station</div></div>
      <div class="spine dark" style="height: 320px; width: 58px;"><div class="t" style="width: 292px;" data-var="recent.4.title" data-overflow="ellipsis" data-hide-if-empty>The Left Hand of Darkness</div></div>
      <div class="spine" style="height: 250px; width: 48px;"><div class="t" style="width: 222px;" data-var="recent.5.title" data-overflow="ellipsis" data-hide-if-empty>Small Gods</div></div>
      <div class="spine" style="height: 290px; width: 60px;"><div class="t" style="width: 262px;" data-var="recent.6.title" data-overflow="ellipsis" data-hide-if-empty>Piranesi</div></div>
      <div class="spine dark" style="height: 310px; width: 54px;"><div class="t" style="width: 282px;" data-var="recent.7.title" data-overflow="ellipsis" data-hide-if-empty>The Dispossessed</div></div>
    </div>
    <div class="plank"></div>
    <div class="count" data-template='{{recent.count}} {{plural(recent.count, "book", "books")}} on the go' data-hide-if-empty>7 books on the go</div>
  </div>
</div>
</body>
</html>
