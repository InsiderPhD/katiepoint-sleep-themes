<!DOCTYPE html>
<html data-kp-orientation="portrait" data-kp-dither="threshold">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(Inter-Regular.ttf); }
  @font-face { font-family: Inter; font-weight: 700; src: url(Inter-Bold.ttf); }
  html, body { margin: 0; height: 100%; }
  body { background: #fff; color: #000; font-family: Inter, sans-serif; }
  .card {
    position: absolute; left: 26px; right: 26px; top: 36px; bottom: 36px; box-sizing: border-box;
    border: 3px solid #000; border-radius: 6px; padding: 22px 24px; display: flex; flex-direction: column;
  }
  .head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px double #000; padding-bottom: 12px; }
  .head b { font-family: Georgia, serif; font-size: 30px; letter-spacing: 3px; }
  .no { font-size: 18px; letter-spacing: 2px; }
  .title { margin-top: 18px; font-size: 30px; font-weight: 700; line-height: 36px; }
  .author { margin-top: 4px; font-size: 18px; }
  .rows { margin-top: 18px; }
  .row { display: flex; align-items: baseline; border-bottom: 1px dashed #000; padding: 9px 0; }
  .lbl { width: 42%; font-family: "Courier New", monospace; font-size: 16px; text-transform: uppercase; }
  .val { flex: 1; font-size: 18px; font-weight: 700; }
  .track { margin-top: 18px; height: 12px; border: 2px solid #000; padding: 2px; }
  .bar { height: 100%; }
  .stamp {
    position: absolute; right: 28px; bottom: 34px; padding: 8px 14px; border: 3px solid #000; border-radius: 6px;
    transform: rotate(-12deg); text-align: center; background: #fff;
  }
  .stamp small { display: block; font-family: "Courier New", monospace; font-size: 14px; letter-spacing: 3px; }
  .stamp div { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="card">
    <div class="head"><b>LIBRARY</b><span class="no" data-template="No. {{stats.books_started:0000}}">No. 0019</span></div>
    <div class="title" data-var="book.title" data-max-lines="2" data-overflow="ellipsis" data-hide-if-empty>The War of the Worlds</div>
    <div class="author" data-var="book.author" data-overflow="ellipsis" data-hide-if-empty>H. G. Wells</div>
    <div class="rows">
    <div class="row"><div class="lbl">Borrowed</div><div class="val" data-template="{{book.started:dd.MM.yyyy}}" data-hide-if-empty>17.10.2026</div></div>
    <div class="row"><div class="lbl">Days out</div><div class="val" data-template="{{book.days_reading}}" data-hide-if-empty>12</div></div>
    <div class="row"><div class="lbl">Sittings</div><div class="val" data-template="{{book.sessions}}" data-hide-if-empty>37</div></div>
    <div class="row"><div class="lbl">Time read</div><div class="val" data-template="{{book.time}}" data-hide-if-empty>7h 48m</div></div>
    <div class="row"><div class="lbl">Still to go</div><div class="val" data-template="{{book.time_left}}" data-hide-if-empty>4h 46m</div></div>
    <div class="row"><div class="lbl">Read so far</div><div class="val" data-template="{{book.progress}}%" data-hide-if-empty>62%</div></div>
    </div>
    <div class="track"><div class="bar" data-var="book.progress" data-kind="bar"></div></div>
  </div>
  <div class="stamp"><small>CHECKED</small><div data-template="{{time.now:dd.MM.yyyy}}" data-hide-if-empty>17.10.2026</div></div>
</body>
</html>
