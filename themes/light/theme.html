<!DOCTYPE html>
<html data-kp-orientation="portrait" data-kp-dither="threshold">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(Inter-Regular.ttf); }
  @font-face { font-family: Inter; font-weight: 700; src: url(Inter-Bold.ttf); }
  html, body { margin: 0; height: 100%; }
  body { background: #fff; color: #000; font-family: Inter, sans-serif; }
  .mark { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .logo { width: 210px; height: auto; margin-bottom: 26px; }
  .word { margin-top: 26px; font-size: 22px; font-weight: 700; letter-spacing: 9px; padding-left: 9px; }
  .time { margin-top: 10px; font-size: 18px; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="mark">
    <img class="logo" src="logo.svg" alt="KatiePoint">
    <div class="word">SLEEPING</div>
    <div class="time" data-template="since {{time.now:HH:mm}}" data-hide-if-empty>since 22:41</div>
  </div>
</body>
</html>
